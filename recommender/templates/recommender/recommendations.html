{% extends "recommender/base.html" %}
{% block content %}
<h1>Recommendations for {{ song.track_name }}</h1>
<table border="1" cellpadding="6">
  <tr><th>Track</th><th>Artist</th><th>Similarity</th><th>Distance</th></tr>
  {% for r in results %}
  <tr>
    <td><a href="{% url 'song_detail' r.id %}">{{ r.track_name }}</a></td>
    <td>{{ r.artist_name }}</td>
    <td>{{ r.similarity|floatformat:3 }}</td>
    <td>{{ r.distance|floatformat:3 }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
